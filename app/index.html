<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="assets/abicsLogo.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management</title>
    <script>
        (async function () {
            const response = await fetch("/appconfig/fioriSandboxConfig.json", {
                credentials: "same-origin"
            });
            const config = await response.json();

            try {
                const userResponse = await fetch("/user-api/currentUser", {
                    credentials: "same-origin"
                });
                if (userResponse.ok) {
                    const currentUser = await userResponse.json();
                    const fullName = currentUser.name || [currentUser.firstname, currentUser.lastname].filter(Boolean).join(" ");
                    config.services.UserInfo.adapter.config.user = {
                        id: currentUser.name || currentUser.email,
                        firstName: currentUser.firstname || "",
                        lastName: currentUser.lastname || "",
                        fullName: fullName || currentUser.email || "",
                        email: currentUser.email || ""
                    };
                }
            } catch (error) {
                // Keep the shell usable when user information is temporarily unavailable.
            }

            window["sap-ushell-config"] = config;

            const base = "https://sapui5.hana.ondemand.com/";
            const load = (attrs) => new Promise((resolve, reject) => {
                const s = document.createElement("script");
                Object.entries(attrs).forEach(([k, v]) => s.setAttribute(k, v));
                s.onload = resolve;
                s.onerror = () => reject(new Error("Failed to load " + attrs.src));
                document.head.appendChild(s);
            });

            // 1) ushell sandbox platform bootstrap must run BEFORE sap-ui-core.js
            await load({ id: "sap-ushell-bootstrap", src: base + "test-resources/sap/ushell/bootstrap/sandbox.js" });
            // 2) UI5 core; onInit creates the FLP renderer and places it into #canvas
            await load({
                id: "sap-ui-bootstrap",
                src: base + "resources/sap-ui-core.js",
                "data-sap-ui-libs": "sap.m",
                "data-sap-ui-theme": "sap_horizon",
                "data-sap-ui-compatVersion": "edge",
                "data-sap-ui-async": "true",
                "data-sap-ui-oninit": "module:sap/ushell/shells/sandbox/fioriSandboxInit",
                "data-sap-ui-resourceroots": JSON.stringify({ "sap.ushell.shells.sandbox": base + "test-resources/sap/ushell/shells/sandbox/" })
            });
        })();
    </script>
</head>
<body class="sapUiBody sapUShellFullHeight">
    <div id="canvas" class="sapUShellFullHeight"></div>
</body>
</html>
